<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senshi-Kan - Karate Reflex Challenge</title>
    <style>
        :root {
            --primary: #f00;
            --excellent: #064e3b;
            --good: #b45309;
            --slow: #7f1d1d;
            --bg-dark: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            background: #2a2a2a;
            border: 4px solid #444;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 24px;
            color: #ffcc00;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 2px 2px #000;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #111;
            padding: 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        #target-area {
            width: 100%;
            height: 250px;
            background: #333;
            border: 2px dashed #555;
            border-radius: 10px;
            position: relative;
            margin-bottom: 20px;
            cursor: pointer;
            overflow: hidden;
        }

        /* Estilo base del objetivo en pantalla */
        #target {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            position: absolute;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
        }

        /* Clase dinámica para el blanco BUENO (Foco de Karate) */
        .target-good {
            background: radial-gradient(circle, #f00 30%, #fff 31%, #fff 60%, #000 61%);
        }

        /* Clase dinámica para el blanco MALO / TRAMPA (Shuriken/Escudo prohibido) */
        .target-bad {
            background: radial-gradient(circle, #000 20%, #ffcc00 21%, #111 45%, #ffcc00 46%, #000 70%);
            border: 3px dashed #ff0000;
        }

        #target:active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        .btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover {
            background: #e6b800;
        }

        /* Pantallas superpuestas (Feedback y Reporte) */
        .overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            border-radius: 11px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .overlay.active {
            display: flex;
        }

        .feedback-popup {
            position: absolute;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 5;
            text-shadow: 2px 2px #000;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
            100% { opacity: 0; transform: translate(-50%, -50%) translateY(-40px); }
        }

        .results-table {
            width: 100%;
            margin: 15px 0;
            border-collapse: collapse;
            font-size: 14px;
        }

        .results-table th, .results-table td {
            border: 1px solid #444;
            padding: 8px;
            text-align: center;
        }

        .results-table th {
            background-color: #222;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Karate Reflex Challenge</h1>
        <p id="welcome-user" style="color: #aaa; margin-bottom: 10px; font-size: 14px;"></p>
        
        <div class="stats-bar">
            <div>Puntos: <span id="score-display">0</span></div>
            <div>Intento: <span id="attempt-display">0</span>/10</div>
        </div>

        <div id="target-area">
            <div id="target"></div>
            
            <div id="start-screen" class="overlay active">
                <h2 style="margin-bottom: 11px; color: #ffcc00;">¿Listo, Karateca?</h2>
                <p style="margin-bottom: 10px; font-size: 14px; color: #fff; padding: 0 10px;">
                    🟢 Golpea rápido el <b>Foco Rojo</b>.<br>
                    ❌ ¡<b>NO GOLPEES</b> el blanco amarillo con negro o perderás!
                </p>
                <button class="btn" onclick="startGame()">¡Hajime! (Iniciar)</button>
            </div>

            <div id="report-screen" class="overlay">
                <h2 id="report-title" style="color: #ffcc00; margin-bottom: 5px;">¡Fin del Entrenamiento!</h2>
                <p id="final-score" style="font-size: 18px; font-weight: bold; margin-bottom: 10px;"></p>
                
                <div style="max-height: 110px; overflow-y: auto; width: 100%;">
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Tiempo / Estado</th>
                                <th>Puntos</th>
                            </tr>
                        </thead>
                        <tbody id="results-body"></tbody>
                    </table>
                </div>

                <button class="btn" style="margin-top: 10px; background: #e53e3e; color: white;" onclick="returnToPortal()">Volver al Portal</button>
            </div>
        </div>
        
        <p style="font-size: 12px; color: #666;">Control de distracción activo • Senshi-Kan</p>
    </div>

    <script>
        // --- CONFIGURACIÓN Y VARIABLES DE ESTADO ---
        let playerName = "Invitado";
        let score = 0;
        let currentAttempt = 0;
        const totalAttempts = 10;
        let targetSpawnTime = 0;
        let targetTimeout;
        let badTargetLifespanTimeout; // Controla los 2 segundos de desaparición automática del malo
        let gameActive = false;
        let attemptsData = [];
        let currentTargetType = "good"; // Puede ser "good" o "bad"
        let gameOverByTrap = false;

        // Referencias del DOM
        const target = document.getElementById('target');
        const targetArea = document.getElementById('target-area');
        const scoreDisplay = document.getElementById('score-display');
        const attemptDisplay = document.getElementById('attempt-display');
        const startScreen = document.getElementById('start-screen');
        const reportScreen = document.getElementById('report-screen');
        const resultsBody = document.getElementById('results-body');
        const finalScoreText = document.getElementById('final-score');
        const reportTitle = document.getElementById('report-title');
        const welcomeUserText = document.getElementById('welcome-user');

        // Capturar datos del alumno desde la URL
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('nombre')) {
                playerName = params.get('nombre');
                welcomeUserText.innerText = `Atleta: ${playerName}`;
            }
        };

        // --- LÓGICA DEL JUEGO ---
        function startGame() {
            score = 0;
            currentAttempt = 0;
            attemptsData = [];
            gameOverByTrap = false;
            scoreDisplay.innerText = score;
            attemptDisplay.innerText = currentAttempt;
            startScreen.classList.remove('active');
            reportScreen.classList.remove('active');
            reportTitle.innerText = "¡Fin del Entrenamiento!";
            reportTitle.style.color = "#ffcc00";
            gameActive = true;
            nextAttempt();
        }

        function nextAttempt() {
            if (!gameActive) return;

            target.style.display = 'none';
            clearTimeout(badTargetLifespanTimeout);

            // Si ya completó los 10 intentos permitidos con éxito, termina el juego de forma normal
            if (currentAttempt >= totalAttempts) {
                endGame();
                return;
            }

            currentAttempt++;
            attemptDisplay.innerText = currentAttempt;

            // Tiempo de espera aleatorio entre 1.5 y 3.5 segundos
            const randomDelay = Math.random() * 2000 + 1500;
            targetTimeout = setTimeout(spawnTarget, randomDelay);
        }

        function spawnTarget() {
            if (!gameActive) return;

            // Decidir de forma aleatoria el tipo de objetivo (70% Bueno, 30% Objeto Trampa)
            currentTargetType = Math.random() < 0.3 ? "bad" : "good";

            // Limpiar clases previas y asignar la nueva estética correspondiente
            target.className = "";
            if (currentTargetType === "good") {
                target.classList.add('target-good');
            } else {
                target.classList.add('target-bad');
            }

            // Dimensiones del área para evitar desbordes
            const areaWidth = targetArea.clientWidth;
            const areaHeight = targetArea.clientHeight;

            const padding = 40;
            const randomX = Math.random() * (areaWidth - padding * 2) + padding;
            const randomY = Math.random() * (areaHeight - padding * 2) + padding;

            target.style.left = `${randomX}px`;
            target.style.top = `${randomY}px`;
            target.style.display = 'block';

            targetSpawnTime = performance.now();

            // Si el objeto es MALO, programar su desaparición automática tras exactamente 2 segundos (2000ms)
            if (currentTargetType === "bad") {
                badTargetLifespanTimeout = setTimeout(function() {
                    if (gameActive && target.style.display === 'block') {
                        target.style.display = 'none';
                        // Registrar en la tabla que se evitó con éxito la trampa
                        attemptsData.push({
                            attempt: currentAttempt,
                            time: "Evitado 🛡️",
                            points: 0
                        });
                        showFeedbackPopup("¡BIEN EVITADO!", "#3182ce");
                        nextAttempt(); // Continúa el juego de forma fluida
                    }
                }, 2000);
            }
        }

        // Evento al golpear (hacer clic o tocar) el objetivo activo
        target.addEventListener('pointerdown', function(e) {
            e.stopPropagation();
            
            if (target.style.display === 'none' || !gameActive) return;

            clearTimeout(badTargetLifespanTimeout);
            target.style.display = 'none';

            if (currentTargetType === "bad") {
                // ¡TOCÓ UN OBJETO TRAMPA! Se acaba el juego de inmediato
                gameOverByTrap = true;
                attemptsData.push({
                    attempt: currentAttempt,
                    time: "¡TRAMPA TOCADA! 💥",
                    points: 0
                });
                showFeedbackPopup("¡TRAMPA! KO", "#e53e3e");
                endGame();
            } else {
                // Golpeó un objeto bueno: evaluar desempeño normal por tiempo de reacción
                const hitTime = performance.now();
                const reactionTime = (hitTime - targetSpawnTime) / 1000;
                evaluateHit(reactionTime);
                nextAttempt();
            }
        });

        function evaluateHit(time) {
            let points = 0;
            let text = "MUY LENTO";
            let color = varStyle('--slow');

            if (time < 0.750) {
                points = 3;
                text = "¡EXCELENTE! 🔥";
                color = varStyle('--excellent');
            } else if (time >= 0.751 && time <= 0.990) {
                points = 2;
                text = "¡BIEN! 👍";
                color = varStyle('--good');
            } else if (time > 0.990 && time <= 3.000) {
                points = 1;
                text = "LENTO 🥋";
                color = varStyle('--slow');
            } else {
                points = 0;
                text = "FUERA DE TIEMPO";
                color = "#555";
            }

            score += points;
            scoreDisplay.innerText = score;

            attemptsData.push({
                attempt: currentAttempt,
                time: time.toFixed(3) + "s",
                points: points
            });

            showFeedbackPopup(text, color);
        }

        function showFeedbackPopup(text, color) {
            const popup = document.createElement('div');
            popup.className = 'feedback-popup';
            popup.innerText = text;
            popup.style.color = color;
            popup.style.left = target.style.left;
            popup.style.top = target.style.top;
            targetArea.appendChild(popup);

            setTimeout(() => popup.remove(), 600);
        }

        function endGame() {
            gameActive = false;
            clearTimeout(targetTimeout);
            clearTimeout(badTargetLifespanTimeout);
            target.style.display = 'none';

            // Ajustar el título del reporte si perdió por caer en la trampa
            if (gameOverByTrap) {
                reportTitle.innerText = "¡Descalificado por Distracción!";
                reportTitle.style.color = "#e53e3e";
            }

            // Renderizar la tabla de resultados acumulados
            resultsBody.innerHTML = "";
            attemptsData.forEach(data => {
                const row = `<tr>
                    <td>${data.attempt}</td>
                    <td>${data.time}</td>
                    <td>${data.points}</td>
                </tr>`;
                resultsBody.innerHTML += row;
            });

            finalScoreText.innerText = `Puntuación Total: ${score} Pts`;
            reportScreen.classList.add('active');

            // Guardado automático en el backend (Sheets)
            sendDataToBackend();
        }

        // --- SISTEMA DE INTEGRACIÓN Y ENVÍO DE DATOS ---
        function sendDataToBackend() {
            console.log(`Enviando resultados de ${playerName}: ${score} puntos acumulados.`);
            
            const webAppUrl = "https://script.google.com/macros/s/.../exec"; 

            const data = {
                Nombre_Alumno: playerName,
                Nombre_Reto: "KARATE_REFLEX_CHALLENGE",
                Puntuacion: score,
                Fecha: new Date().toISOString()
            };

            fetch(webAppUrl, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            }).catch(err => console.log("Nota de red:", err));
        }

        function returnToPortal() {
            const portalUrl = "https://americordzn-karate.github.io/retos/";
            window.location.href = `${portalUrl}?nombre=${encodeURIComponent(playerName)}&score=${score}`;
        }

        function varStyle(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }
    </script>
</body>
</html>
